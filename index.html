
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span class="logo-icon">💰</span> SpendWise
        </div>

        <nav class="sidebar-menu">
            <a href="#" class="menu-item active">Dashboard</a>
            <a href="#transactions" class="menu-item">Transactions</a>
            <a href="#budgets" class="menu-item">Budgets</a>
            <a href="#analytics" class="menu-item">Analytics</a>
            <a href="#settings" class="menu-item">Settings</a>
        </nav>
    </aside>

    <!-- Header -->
    <header class="header">
        <div class="header-search">
            <input type="search" id="search-input"
                placeholder="Search transactions...">
        </div>

        <div class="header-profile">
            <span class="notification-badge">🔔</span>
            <div class="profile-avatar">JD</div>
            <span class="profile-name">John Doe</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">

        <h1>Welcome to SpendWise</h1>
        <p>Manage your budget and track your expenses.</p>

        <!-- Budget Summary -->
        <section class="dashboard-summary">

            <div class="card">
                <div class="card-header">
                    <span class="card-icon">💰</span>
                </div>
                <div class="card-body">
                    <h3 class="card-title">Total Budget</h3>
                    <p class="card-amount" id="total-budget">
                        KSh 290,000
                    </p>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-icon">💳</span>
                </div>
                <div class="card-body">
                    <h3 class="card-title">Total Expenses</h3>
                    <p class="card-amount" id="total-expenses">
                        KSh 0
                    </p>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-icon">📊</span>
                </div>
                <div class="card-body">
                    <h3 class="card-title">Remaining Balance</h3>
                    <p class="card-amount" id="remaining-balance">
                        KSh 290,000
                    </p>
                </div>
            </div>

        </section>

        <!-- Budget Categories -->
        <section id="budgets">
            <h2>My Budgets</h2>

            <div class="dashboard-grid" id="dashboard-grid">
                <!-- Budget cards will be added using JavaScript -->
            </div>
        </section>

        <!-- Add Expense -->
        <section class="expense-section">

            <h2>Add New Expense</h2>

            <form id="expense-form">

                <label for="expense-name">Expense Name</label>
                <input
                    type="text"
                    id="expense-name"
                    placeholder="Example: Lunch"
                    required
                >

                <label for="expense-amount">Amount (KSh)</label>
                <input
                    type="number"
                    id="expense-amount"
                    placeholder="Example: 500"
                    min="1"
                    step="0.01"
                    required
                >

                <label for="expense-category">Category</label>
                <select id="expense-category" required>
                    <option value="">Select category</option>
                    <option value="Food & Dining">Food & Dining</option>
                    <option value="Transport">Transport</option>
                    <option value="Rent & Housing">Rent & Housing</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Savings Goal">Savings Goal</option>
                    <option value="Utilities">Utilities</option>
                </select>

                <button type="submit">Add Expense</button>

            </form>

            <p id="feedback-message" aria-live="polite"></p>

        </section>

        <!-- Transactions -->
        <section class="transactions-section" id="transactions">

            <h2>Recent Transactions</h2>

            <div id="expense-list">
                <!-- Expense records will appear here -->
            </div>

        </section>

    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
